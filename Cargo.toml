[package]
name = "lazarobox-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Javi Lázaro <hola@javilazaro.es>"]

[dependencies]
# Async Runtime & Red
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"

# TUI & Terminal Handling
ratatui = "0.30"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Auth & Security
keyring = "2.3"
oauth2 = "4.4"

# CLI & Logging
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
insta = "1"
