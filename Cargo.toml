[package]
name = "lazarobox-shell"
version = "0.15.3"
edition = "2024"
rust-version = "1.88"
authors = ["Javi Lázaro <hola@javilazaro.es>"]
description = "AI-aware terminal workspace: a TUI multiplexer with panes, tabs, copy mode, local AI engine selection and an experimental Ollama chat pane."
license = "MIT"
repository = "https://github.com/pichu2707/lazarobox-shell"
homepage = "https://github.com/pichu2707/lazarobox-shell"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tui", "ai", "shell"]
categories = ["command-line-utilities"]
exclude = [
    "/openspec/",
    "/docs/",
    "/packaging/",
    "/scripts/",
    "/.claude/",
    "/.atl/",
    "/.github/",
    "/cliff.toml",
    "/RELEASING.md",
]

[dependencies]
# Async Runtime
tokio = { version = "1.38", features = ["full"] }

# TUI & Terminal Handling
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
portable-pty = "0.9"
libc = "0.2"
vt100 = "0.16.2"
futures = "0.3"

# Serialization & Config
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"

# Chat history store (SQLite compiled in; needs a C compiler)
rusqlite = { version = "0.38", features = ["bundled"] }

# NFC normalisation of note titles before they become topic keys
unicode-normalization = "0.1.25"
# Display width of chat text (wrapping, cursor column)
unicode-width = "0.2"
# Grapheme clusters: ratatui draws and measures per cluster, so must we
unicode-segmentation = "1.13"

# CLI jail (Linux Landlock). Pinned exactly: the helper treats anything but
# FullyEnforced as "not jailed", so the API it was reviewed against must not drift.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"

[dev-dependencies]
insta = "1"
tempfile = "3"
tokio = { version = "1.38", features = ["test-util"] }
