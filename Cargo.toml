[package]
name = "lazarobox-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Javi Lázaro <hola@javilazaro.es>"]
description = "AI-aware terminal workspace: a TUI multiplexer with panes, tabs, copy mode and local AI engine selection."
license = "MIT"
repository = "https://github.com/pichu2707/lazarobox-shell"
homepage = "https://github.com/pichu2707/lazarobox-shell"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tui", "ai", "shell"]
categories = ["command-line-utilities"]
exclude = [
    "/openspec/",
    "/docs/",
    "/packaging/",
    "/scripts/",
    "/.claude/",
    "/.atl/",
    "/.github/",
    "/cliff.toml",
    "/RELEASING.md",
]

[dependencies]
# Async Runtime & Red
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"

# TUI & Terminal Handling
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
portable-pty = "0.9"
libc = "0.2"
vt100 = "0.16.2"
futures = "0.3"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"

# Auth & Security
keyring = "2.3"
oauth2 = "4.4"

# CLI & Logging
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
insta = "1"
tempfile = "3"
