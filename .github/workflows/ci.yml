name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-latest
          - name: macOS (arm64)
            os: macos-14
          # macos-13 (the former Intel image) was retired by GitHub; this is
          # the Intel x86_64 image that replaces it.
          - name: macOS (Intel x86_64)
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned so that a new Rust release cannot break CI
      # without a code change; bumping it is a deliberate PR. The MSRV
      # (`rust-version` in Cargo.toml) is checked by the `msrv` job below.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # `rust-version` in Cargo.toml is 1.88 (edition 2024): the oldest compiler
  # the crate promises to build with, which the pinned toolchain above cannot
  # prove on its own.
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked --all-targets
