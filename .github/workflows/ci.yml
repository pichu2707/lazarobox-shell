name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-latest
          - name: macOS (arm64)
            os: macos-15
          # macos-13 (the former Intel image) was retired by GitHub; this is
          # the Intel x86_64 image that replaces it.
          - name: macOS (Intel x86_64)
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain is pinned so that a new Rust release cannot break CI
      # without a code change; bumping it is a deliberate PR. The MSRV
      # (`rust-version` in Cargo.toml) is checked by the `msrv` job below.
      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # The release script edits Cargo.toml, Cargo.lock and CHANGELOG.md; a bug
      # there would only show up on release day.
      - name: Release script tests
        if: runner.os == 'Linux'
        run: .github/scripts/tests/prepare-release-test.sh

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # These two steps prove, on the real runners, that
      # `/usr/bin/sandbox-exec` exists and that the argv shape the jail uses
      # (`-p`, `-D KEY=VALUE`, `--`) really confines.
      # A failure prints the exit code, stderr and `sw_vers`.
      - name: Seatbelt smoke (raw sandbox-exec)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sandbox_exec=/usr/bin/sandbox-exec
          # Seatbelt matches real paths: /var/folders is /private/var/folders.
          dir="$(cd "$(mktemp -d -t lazarobox)" && pwd -P)"
          mkdir "$dir/rw" "$dir/denied"
          profile='(version 1)(deny default)(allow file-read*)(allow file-map-executable)(allow sysctl-read)(allow process-exec (literal (param "EXE")))(allow file-write* (subpath (param "RW")))'

          diagnose() {
            echo "::error::Seatbelt smoke failed: $1 (exit code $2)"
            echo "--- stderr ---"; cat "$dir/err"
            echo "--- stdout ---"; cat "$dir/out"
            echo "--- sw_vers ---"; sw_vers
            ls -l "$sandbox_exec" || true
            exit 1
          }

          # run <label> <program> <arg>: leaves the exit code in $rc.
          run() {
            label=$1; shift
            rc=0
            "$sandbox_exec" -p "$profile" -D EXE=/usr/bin/touch -D "RW=$dir/rw" -- "$@" \
              >"$dir/out" 2>"$dir/err" || rc=$?
          }

          [ -x "$sandbox_exec" ] || { echo "::error::$sandbox_exec is missing"; sw_vers; exit 1; }

          run "positive control: write inside the granted folder" /usr/bin/touch "$dir/rw/ok"
          { [ "$rc" -eq 0 ] && [ -e "$dir/rw/ok" ]; } || diagnose "$label" "$rc"

          run "negative control: write outside the granted folder" /usr/bin/touch "$dir/denied/no"
          { [ "$rc" -ne 0 ] && [ ! -e "$dir/denied/no" ]; } || diagnose "$label" "$rc"

          run "negative control: exec of a program that is not granted" /bin/echo leaked
          { [ "$rc" -ne 0 ] && [ ! -s "$dir/out" ]; } || diagnose "$label" "$rc"

          echo "sandbox-exec works with -p, -D and --: ok"
          sw_vers

      - name: Seatbelt probe (macOS)
        if: runner.os == 'macOS'
        env:
          LAZAROBOX_REQUIRE_JAIL: "1"
        run: cargo test --locked --test jail_macos -- --nocapture

      # Which operation the sandbox denied, for when the probe above fails.
      - name: Seatbelt denials (macOS)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          log show --last 5m --style compact --predicate 'sender == "Sandbox"' | tail -300 || true

      - name: Flag the failure
        if: failure()
        shell: bash
        run: |
          echo "::error title=Real codex through the jail::This job is non-blocking (continue-on-error), so the check can look green while this step failed. Read the job log: the jail may be breaking codex."

  # A real codex, jailed the way a chat turn jails it, must reach OpenAI and
  # get the server's 401 back (no real key is used). It depends on npm and
  # api.openai.com from a datacenter IP, so it is a separate job that never
  # blocks a merge: a geo block, rate limit or Cloudflare challenge is an
  # annotated skip in the test, and `continue-on-error` covers the rest. The
  # version is the one the #180 tester runs. The `check` job does not install
  # codex, so its plain `cargo test` skips this test there. It runs on pushes
  # to main only: macOS runners queue for long on every PR, and a job that
  # never blocks a merge is not worth that wait.
  real-cli-macos:
    name: Real codex (${{ matrix.name }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-15
          - name: macOS (Intel x86_64)
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install codex
        run: npm install --global @openai/codex@0.153.4 --ignore-scripts

      - name: Real codex through the jail
        env:
          LAZAROBOX_REQUIRE_JAIL: "1"
        run: cargo test --locked --test jail_macos_codex -- --nocapture

      - name: Seatbelt denials
        if: failure()
        shell: bash
        run: |
          log show --last 5m --style compact --predicate 'sender == "Sandbox"' | tail -300 || true

  # `rust-version` in Cargo.toml is 1.88 (edition 2024): the oldest compiler
  # the crate promises to build with, which the pinned toolchain above cannot
  # prove on its own.
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check
        run: cargo check --locked --all-targets
