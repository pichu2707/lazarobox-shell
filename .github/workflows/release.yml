name: Release

# Pushing a tag `vX.Y.Z` (or a pre-release tag `vX.Y.Z-rc.N`) publishes that
# version to crates.io and creates the GitHub Release; a pre-release is marked
# as one on GitHub. Cargo.toml and CHANGELOG.md must already be updated on the
# tagged commit.
#
# One-click path: Actions -> Release -> Run workflow (on main). The `prepare`
# job bumps the version, moves [Unreleased] under it, commits to main and
# pushes the tag, and the jobs below then publish that commit. The bump, the
# tag and the publishing all live in this one file because a tag pushed with
# GITHUB_TOKEN does not start another workflow, and because crates.io Trusted
# Publishing is bound to this workflow file.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump. auto: minor if [Unreleased] has an Added section, else patch."
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Rehearsal: show the new version, the diff and the notes, but change nothing."
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a release halfway: a half-published release is worse than a
# queued one. Grouped by ref: every dispatch runs on main and shares a group,
# while each pushed tag keeps its own, so a second queued tag is never dropped.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Only on a manual run. This is the only job that can write to the repository
  # and the only one that keeps the checkout credentials.
  prepare:
    name: Prepare release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # To look up ci.yml's run for the commit being released.
      actions: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Must run on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow on main (it was run on $GITHUB_REF)."
            exit 1
          fi

      # Releasing is not allowed to skip CI: the macOS matrix only runs there,
      # and the gate below repeats just the Linux half.
      - name: Main must have passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          if [ "$runs" -eq 0 ]; then
            echo "::error::ci.yml has no successful run for $GITHUB_SHA. Wait for CI on main to finish (or fix it), then run this again."
            exit 1
          fi

      # Credentials stay in the checkout: the push below needs them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Bump version and changelog
        id: prepare
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(.github/scripts/prepare-release.sh "$BUMP")"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Show the changes
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          TAG: ${{ steps.prepare.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git --no-pager diff --stat
          git --no-pager diff -- Cargo.toml Cargo.lock
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Dry run: nothing was committed, tagged or published"
            else
              echo "## Releasing ${TAG}"
            fi
            echo
            echo "Version: \`${VERSION}\`"
            echo
            echo "### Release notes"
            echo
            .github/scripts/changelog-section.sh "$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      # Both refs go in one atomic push: either main and the tag move, or
      # neither does (for example when main advanced since the run started).
      - name: Commit, tag and push
        id: push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git tag "$TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${TAG}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Runs for a tag push (prepare skipped) and after a successful prepare. A
  # skipped or failed need would normally skip this job; `!cancelled()` plus an
  # explicit check lets the tag-push path through, still stops after a failed
  # prepare, and skips a dry run. The jobs below need verify, so they follow.
  verify:
    name: Verify tag
    needs: prepare
    if: >-
      ${{ !cancelled()
      && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
      && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # What is being released: the commit and tag the event points at, or
      # the ones `prepare` just pushed.
      - name: Resolve the release commit and tag
        id: release
        env:
          PREPARED_SHA: ${{ needs.prepare.outputs.sha }}
          PREPARED_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "sha=${PREPARED_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${PREPARED_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      # Releases come from main only: a tag on an unmerged branch would
      # publish code that never went through main's CI (including macOS).
      - name: Tagged commit must be on main
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Tagged commit $SHA is not on main. Merge it to main first, then tag the merge commit."
            exit 1
          fi

      - name: Tag must match Cargo.toml
        id: version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          tag_version="${TAG#v}"
          # `version` of the [package] table, the first one in the file.
          cargo_version="$(awk -F'"' '/^\[package\]/ {p=1; next} /^\[/ {p=0} p && /^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)"
          if [ -z "$cargo_version" ]; then
            echo "::error file=Cargo.toml::Could not read the package version"
            exit 1
          fi
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $TAG ($tag_version) does not match Cargo.toml version ($cargo_version). Bump Cargo.toml, or delete and recreate the tag."
            exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG must have a section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/changelog-section.sh "$VERSION" > /dev/null

  # The same gate as ci.yml on Linux. The macOS matrix is not repeated: main's
  # CI already ran it before the tag was created.
  gate:
    name: Gate (Linux)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      # Same pinned toolchain as ci.yml; bump both together.
      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  publish:
    name: Publish to crates.io
    needs: [verify, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Trusted Publishing: the OIDC token is exchanged for a short-lived
      # crates.io token. No secret is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      # Makes the job safe to re-run after a partial failure.
      - name: Check whether this version is already on crates.io
        id: exists
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          status="$(curl -s --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' \
            -A 'lazarobox-shell release workflow (https://github.com/pichu2707/lazarobox-shell)' \
            "https://crates.io/api/v1/crates/lazarobox-shell/${VERSION}")"
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"
                 echo "::notice::lazarobox-shell ${VERSION} is already on crates.io; skipping publish." ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::Unexpected HTTP $status from the crates.io API"; exit 1 ;;
          esac

      # No rust-cache here: a cache restored from other jobs must not run in
      # the job where the crates.io token is minted.
      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
        if: steps.exists.outputs.published == 'false'

      - name: Authenticate with crates.io
        id: auth
        if: steps.exists.outputs.published == 'false'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        if: steps.exists.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    name: GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          .github/scripts/changelog-section.sh "$VERSION" > release-notes.md
          # A SemVer pre-release (1.0.0-rc.1) is marked as one, so GitHub
          # never shows it as the latest release.
          case "$VERSION" in
            *-*) pre=(--prerelease) ;;
            *)   pre=() ;;
          esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; updating its notes."
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md "${pre[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md "${pre[@]}"
          fi
