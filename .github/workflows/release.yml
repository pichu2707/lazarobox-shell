name: Release

# Pushing a tag `vX.Y.Z` publishes that version to crates.io and creates the
# GitHub Release. Cargo.toml and CHANGELOG.md must already be updated on the
# tagged commit.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# Never cancel a release halfway: a half-published release is worse than a
# queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Releases come from main only: a tag on an unmerged branch would
      # publish code that never went through main's CI (including macOS).
      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main. Merge it to main first, then tag the merge commit."
            exit 1
          fi

      - name: Tag must match Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag_version="${TAG#v}"
          # `version` of the [package] table, the first one in the file.
          cargo_version="$(awk -F'"' '/^\[package\]/ {p=1; next} /^\[/ {p=0} p && /^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)"
          if [ -z "$cargo_version" ]; then
            echo "::error file=Cargo.toml::Could not read the package version"
            exit 1
          fi
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $TAG ($tag_version) does not match Cargo.toml version ($cargo_version). Bump Cargo.toml, or delete and recreate the tag."
            exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG must have a section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/changelog-section.sh "$VERSION" > /dev/null

  # The same gate as ci.yml on Linux. The macOS matrix is not repeated: main's
  # CI already ran it before the tag was created.
  gate:
    name: Gate (Linux)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same pinned toolchain as ci.yml; bump both together.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  publish:
    name: Publish to crates.io
    needs: [verify, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Trusted Publishing: the OIDC token is exchanged for a short-lived
      # crates.io token. No secret is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Makes the job safe to re-run after a partial failure.
      - name: Check whether this version is already on crates.io
        id: exists
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          status="$(curl -s --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' \
            -A 'lazarobox-shell release workflow (https://github.com/pichu2707/lazarobox-shell)' \
            "https://crates.io/api/v1/crates/lazarobox-shell/${VERSION}")"
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"
                 echo "::notice::lazarobox-shell ${VERSION} is already on crates.io; skipping publish." ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::Unexpected HTTP $status from the crates.io API"; exit 1 ;;
          esac

      # No rust-cache here: a cache restored from other jobs must not run in
      # the job where the crates.io token is minted.
      - uses: dtolnay/rust-toolchain@1.96.0
        if: steps.exists.outputs.published == 'false'

      - name: Authenticate with crates.io
        id: auth
        if: steps.exists.outputs.published == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: steps.exists.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    name: GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          .github/scripts/changelog-section.sh "$VERSION" > release-notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; updating its notes."
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
          fi
